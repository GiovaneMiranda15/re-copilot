[project]
name = "re-copilot"
version = "0.4.0"
description = "Copiloto de Engenharia de Requisitos: diagnóstico, entrevistas por perfil, documentação, backlog e manutenção de requisitos, com RAG por etapa."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giovane Luna Miranda" }]
requires-python = ">=3.12"
keywords = ["requirements-engineering", "rag", "llm", "mcp", "agents"]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# Embeddings semânticos locais (ONNX, sem torch). Sem este extra, só o embedder `hash` (lexical).
embeddings = ["fastembed>=0.8,<0.9"]
# Provedor `anthropic:` do motor (API da Anthropic).
anthropic = ["anthropic>=1.0"]
# Servidor MCP: expõe o recop e o motor a qualquer cliente MCP.
mcp = ["mcp>=2.3,<3"]
all = ["re-copilot[embeddings,anthropic,mcp]"]

[project.scripts]
rag-re-engine = "rag_re_engine.cli:main"
recop = "recop:main"
re-copilot-mcp = "rag_re_engine.mcp_server:main"

[project.urls]
Repository = "https://github.com/GiovaneMiranda15/re-copilot"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/rag_re_engine"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/recop.py" = "recop.py"
"SKILL.md" = "rag_re_engine/skill/SKILL.md"
"references" = "rag_re_engine/skill/references"
"roles" = "rag_re_engine/skill/roles"

[tool.pytest.ini_options]
testpaths = ["tests", "engine/tests"]
pythonpath = ["engine/src", "scripts"]

[dependency-groups]
dev = ["pytest>=9.0"]
